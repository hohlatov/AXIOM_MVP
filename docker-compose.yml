version: "3.9"

services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: axiom
      POSTGRES_PASSWORD: axiom
      POSTGRES_DB: axiom
    volumes:
      - axiom_pg_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U axiom"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"

  backend:
    build: ./axiom-backend
    restart: unless-stopped
    env_file:
      - ./axiom-backend/.env  # <-- ПУТЬ ИСПРАВЛЕН
    environment:
      - DATABASE_URL=postgresql://axiom:axiom@db:5432/axiom  # <-- ИСПРАВЛЕНО
      - REDIS_URL=redis://redis:6379/0
      - FRONTEND_URL=https://relaxdev.ru
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - "8000:8000"
    volumes:
      - ./axiom-backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ./axiom-frontend
      args:
        - NEXT_PUBLIC_API_URL=https://relaxdev.ru/api
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=https://relaxdev.ru/api  # <-- ДОБАВЛЕНО

volumes:
  axiom_pg_data: